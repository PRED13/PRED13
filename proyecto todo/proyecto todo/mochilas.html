<html lang="es">

    <title>Mochilas y Maletas</title>
    <link rel="stylesheet" href="mochilas.css">

<style>

header {
    background-color: #333;
    color: white;
    padding: 15px;
    text-align: center;
}

h1 {
    margin: 0;
}

.productos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    justify-items: center;
}

.producto {
    width: 220px;
    height: 320px; /* todas del mismo alto */
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    padding: 10px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
}

.producto img {
    width: 100%;
    height: 200px; /* igual altura para todas las imágenes */
    object-fit: contain; /* mantiene proporción sin recortar ni deformar */
    border-radius: 5px;
}

.producto p {
    margin: 5px 0;
}

.precio {
    font-weight: bold;
    color: #e60000;
}

.btn-compra {
    background-color: #ff9900; /* Naranja estilo Amazon */
    color: #111;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease-in-out;
    font-size: 14px;
}

.btn-compra:hover {
    background-color: #e68a00;
}
</style>

<body>
